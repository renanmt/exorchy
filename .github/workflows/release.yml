# Release: push a tag vX.Y.Z and this builds the pacman package in a clean
# Arch container (release build + core tests, packaging/aur/PKGBUILD) and
# publishes a GitHub release with the package, its checksum and install.sh.
# "Run workflow" (manual) only builds and keeps the files as an artifact:
# a dry run of a release. The notes are the tag's CHANGELOG.md section.
# See docs/RELEASING.md.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install build tools and the package's dependencies
        run: |
          pacman -Syu --noconfirm --needed git rust pkgconf github-cli \
            gtk4 libadwaita poppler-glib gstreamer gst-plugins-base \
            openssl xdg-utils hicolor-icon-theme

      - uses: actions/checkout@v4

      - name: Trust the checkout (git archive runs as root in the container)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: The tag, Cargo.toml and the PKGBUILD agree on the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          ver=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          pkgver=$(sed -n 's/^pkgver=//p' packaging/aur/PKGBUILD)
          echo "tag $GITHUB_REF_NAME, Cargo.toml $ver, PKGBUILD $pkgver"
          [ "v$ver" = "$GITHUB_REF_NAME" ] || { echo "::error::Cargo.toml version $ver does not match tag $GITHUB_REF_NAME"; exit 1; }
          [ "$pkgver" = "$ver" ] || { echo "::error::packaging/aur/PKGBUILD pkgver $pkgver does not match $ver"; exit 1; }

      - name: Release notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # Fails (before the long build) when the version has no section.
          packaging/release/changelog-section.sh "$GITHUB_REF_NAME" > changes.md
          cat changes.md

      - name: Build the package (release build, core tests)
        run: packaging/release/build-package.sh dist

      - name: Keep the files (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: exorchy-package
          path: dist/

      - name: Publish the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${GITHUB_REF_NAME#v}"
          {
            cat changes.md
            cat <<'NOTES'

          ---

          ## Install or update

          Already have eXorchy 0.4 or later? Click **Update** in the banner, or in Settings → About.

          Otherwise, on Arch / Omarchy:

          ```bash
          curl -fsSL https://github.com/renanmt/exorchy/releases/latest/download/install.sh | bash
          ```

          Or download `exorchy-x86_64.pkg.tar.zst`, check it with `sha256sum -c exorchy-x86_64.pkg.tar.zst.sha256`, and run `sudo pacman -U exorchy-x86_64.pkg.tar.zst`. Remove it with `sudo pacman -R exorchy` (your settings and games stay).
          NOTES
            echo
            echo "Every release: [CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/main/CHANGELOG.md)"
          } > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "eXorchy $ver" \
            --notes-file notes.md \
            --verify-tag
